name: Python Syntax & Code Integrity Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile python files
        run: |
          python -m py_compile producer.py mongo_to_hdfs.py churn_analysis.py dashboard.py
          echo "All Python scripts compiled successfully without syntax errors."
